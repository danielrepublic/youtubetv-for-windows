name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'push' && github.ref_type == 'tag' &&
      github.ref_protected && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Checkout the protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Validate the protected stable version tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -notmatch '^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$') {
            throw "Refusing non-stable release tag: $tag"
          }
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match package version $version"
          }

      - name: Install, test, and package
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npm run lint
          npm run format:check
          npm run package
          npm run verify:artifacts

      - name: Refuse to overwrite an existing release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Refusing to overwrite existing release $env:GITHUB_REF_NAME"
          }

      - name: Write bilingual release notes
        shell: pwsh
        run: |
          @'
          ## 繁體中文

          此版本提供 x64 Windows 安裝檔。請下載 `youtubetv-for-windows-<version>-x64.exe`。

          此程式不是 YouTube 或 Google 的官方產品。安裝檔未經程式碼簽署，Windows SmartScreen 可能顯示警告。

          ## English

          This release provides an x64 Windows installer. Download `youtubetv-for-windows-<version>-x64.exe`.

          This is not an official YouTube or Google product. The installer is not code-signed, so Windows SmartScreen may warn.
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/release-notes.md"

      - name: Publish immutable GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "youtubetv-for-windows-$version-x64.exe"
          gh release create $env:GITHUB_REF_NAME "release-output/$installer" --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --notes-file "$env:RUNNER_TEMP/release-notes.md" --verify-tag
